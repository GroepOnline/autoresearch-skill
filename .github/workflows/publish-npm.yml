name: Publish npm package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run validate
      - run: npm run format:check
      - run: npm run audit:ci
      - run: npm run verify:package
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Publish when version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version already exists; nothing to publish."
            exit 0
          fi
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required" >&2; exit 1; }
          npm publish --access public --provenance
