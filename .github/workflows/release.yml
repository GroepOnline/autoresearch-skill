name: Release

# Merge to main cuts the tag AND publishes in the same job. A GITHUB_TOKEN tag
# push does not start a second workflow, so publish cannot wait for the tag
# event. A manual `git push` of a v* tag still runs the tag job. Put
# [skip release] in the merge commit to opt out.
on:
  push:
    branches: [main]
    tags:
      - "v*"

# One lock for the main bump and the tag publish so they cannot both pass the
# "version missing" check and then collide on npm's immutable versions.
concurrency:
  group: npm-publish-pi-autoresearch
  cancel-in-progress: false

jobs:
  bump:
    name: bump + tag + publish
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && !startsWith(github.event.head_commit.message, 'chore: release')
      && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Sync to origin/main
        run: |
          git fetch origin main --tags --force
          git reset --hard origin/main
      - run: npm ci --ignore-scripts
      - name: Validate (python + ts + eslint + typecheck + manifests)
        run: npm run validate
      - name: Cut release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs auto --push
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: sh scripts/npm-publish.sh
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/github-release.sh

  publish:
    name: test + publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --ignore-scripts
      - name: Validate (python + ts + eslint + typecheck + manifests)
        run: npm run validate
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: sh scripts/npm-publish.sh
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/github-release.sh "${GITHUB_REF_NAME}"
