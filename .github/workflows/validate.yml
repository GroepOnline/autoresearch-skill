name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Show runtime versions
        working-directory: repo
        run: |
          set -euo pipefail
          python3 --version
          node --version
          npm --version

      - name: Install Node dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          npm ci

      - name: Run all validation (Python tests, TS tests, typecheck)
        working-directory: repo
        run: |
          set -euo pipefail
          npm run validate
