name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Ordinary private CI: current pr-isolated/heavy compatibility bridge.
    # company-ci remains the target only after ephemeral capacity is proven.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Self-hosted runners persist _work between jobs: a stale repo/ from a
          # previous run would make `git remote add` fail. Start clean every time.
          rm -rf repo
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Show runtime versions
        working-directory: repo
        run: |
          set -euo pipefail
          python3 --version
          node --version
          npm --version

      - name: Install Node dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          npm ci

      - name: Run all validation (Python tests, TS tests, typecheck)
        working-directory: repo
        run: |
          set -euo pipefail
          npm run validate
