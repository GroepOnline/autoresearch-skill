# On trusted PR events: sync this repo → Linear CHEF child issues (+ Notion when configured).
# Fork pull requests are intentionally excluded because this workflow receives organization secrets.

name: CHEF Linear + Notion Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: chef-linear-notion-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: GroepOnline/OrgBeheer/.github/workflows/chef-dev-sync-reusable.yml@61838e02e8e3ed7cdb88711da9eb42dc00f8c521
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    with:
      repo: ${{ github.event.repository.name }}
