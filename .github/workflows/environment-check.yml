name: Environment Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: environment-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository files
        run: |
          set -euo pipefail
          test -f .env.example
          test -f docs/environment.md
          test -f docs/automation.md
          test -f scripts/bootstrap-env.sh
          bash -n scripts/bootstrap-env.sh

      - name: Check placeholder secrets only
        run: |
          set -euo pipefail
          if grep -Eq '(sk-[A-Za-z0-9]|ghp_[A-Za-z0-9]|AKIA[0-9A-Z]{16})' .env.example; then
            echo 'Potential real secret detected in .env.example' >&2
            exit 1
          fi

      - name: Report safety defaults
        run: |
          set -euo pipefail
          grep -q '^DRY_RUN=true$' .env.example
          grep -q '^REQUIRE_HUMAN_APPROVAL_FOR_DESTRUCTIVE_ACTIONS=true$' .env.example
          grep -q '^COMPUTER_USE_ENABLED=false$' .env.example
