# Ordinary private CI via the org reusable. Keep the workflow name `CI` and
# job `ci` for check-name stability. validate.yml is the authoritative gate.
# The pinned reusable already uses the pr-isolated/heavy compatibility bridge;
# do not retarget it to ubuntu-latest or unproven company-ci.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    uses: GroepOnline/.github/.github/workflows/ci.yml@64b52a28a0720444572737cb882f37bac253dc79
    with:
      language: node
